# Sobe o sistema distribuído completo: dois containers que conversam apenas
# por HTTP, como dois servidores diferentes.
#
#   docker compose up --build
#
# Interface: http://localhost:8501   ·   API (Swagger): http://localhost:8000/docs
# Portas ocupadas? Troque com API_PORT=8010 WEB_PORT=8511 docker compose up

name: manutencao

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    # Variáveis opcionais (JWT_SECRET, ADMIN_INITIAL_PASSWORD...) vêm do .env,
    # se existir. Sem ele, a API usa os valores de desenvolvimento.
    env_file:
      - path: .env
        required: false
    volumes:
      - dados:/dados
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${WEB_PORT:-8501}:8501"
    environment:
      # Dentro da rede do Compose, a API é encontrada pelo nome do serviço.
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # Guarda o manutencao.db entre execuções (apague com: docker compose down -v).
  dados:
